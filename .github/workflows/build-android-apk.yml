name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "mobile/app.json"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - "mobile/plugins/**"
      - "mobile/assets/**"
      - ".github/workflows/build-android-apk.yml"

# A newer build cancels one still running.
concurrency:
  group: build-android-apk
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android Release APK
        env:
          EXPO_PUBLIC_API_BASE_URL: https://payit-production.up.railway.app/api/app/v1
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PROXIM_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PROXIM_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PROXIM_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/proxim-release.keystore
            export PROXIM_RELEASE_STORE_FILE="proxim-release.keystore"
            export PROXIM_RELEASE_KEY_ALIAS="${PROXIM_RELEASE_KEY_ALIAS:-proxim-release}"
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: List built APK outputs
        run: ls -lh android/app/build/outputs/apk/release/

      - name: Upload Proxim Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Proxim-Android-APK
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
