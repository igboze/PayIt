name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "mobile/app.json"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - "mobile/plugins/**"
      - "mobile/assets/**"
      - "mobile/src/**"
      - "mobile/App.tsx"
      - ".github/workflows/build-android-apk.yml"

# contents: write lets the job publish the APK to the "android-latest" release.
permissions:
  contents: write

concurrency:
  group: build-android-apk
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android Release APK & Play Store AAB
        env:
          EXPO_PUBLIC_API_BASE_URL: https://payit-production.up.railway.app/api/app/v1
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PROXIM_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PROXIM_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PROXIM_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/proxim-release.keystore
            export PROXIM_RELEASE_STORE_FILE="proxim-release.keystore"
            export PROXIM_RELEASE_KEY_ALIAS="${PROXIM_RELEASE_KEY_ALIAS:-proxim-release}"
          fi
          cd android
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: List built APK & AAB outputs
        run: |
          ls -lh android/app/build/outputs/apk/release/
          if [ -d android/app/build/outputs/bundle/release ]; then
            ls -lh android/app/build/outputs/bundle/release/
          fi

      - name: Upload Proxim Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Proxim-Android-APK
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Proxim Play Store AAB artifact
        if: hashFiles('mobile/android/app/build/outputs/bundle/release/*.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Proxim-PlayStore-AAB
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # A fixed, public download link for the newest SIGNED APK:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/Proxim.apk
      - name: Publish signed APK to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "::warning::Skipping public android-latest release upload because APK is unsigned (configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD in GitHub Secrets)."
            exit 0
          fi
          cp android/app/build/outputs/apk/release/app-release.apk Proxim.apk
          VERSION=$(node -p "require('./app.json').expo.version")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          NOTES="Proxim ${VERSION} (build ${CODE}) from ${GITHUB_SHA::7}. Install once; later UI updates arrive inside the app automatically."
          if gh release view android-latest > /dev/null 2>&1; then
            gh release edit android-latest --title "Proxim Android ${VERSION} (latest)" --notes "$NOTES"
          else
            gh release create android-latest --title "Proxim Android ${VERSION} (latest)" --notes "$NOTES" --latest=false
          fi
          gh release upload android-latest Proxim.apk --clobber
